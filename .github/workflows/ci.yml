name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  GO_VERSION: '1.23'
  GO_TEST_MODE: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Generate stub types for testing
        run: |
          mkdir -p gen/chat/v1/chatv1connect
          cat > gen/chat/v1/chat.pb.go << 'EOFPB'
          package chatv1
          type User struct { Id, Username string }
          type Channel struct { Id, Name, Label string; Users []*User }
          type Message struct { Id, ChannelId, UserId, Content string; Timestamp int64 }
          type JoinChannelRequest struct { ChannelToJoin *Channel }
          type JoinChannelResponse struct { MessageStream *Message }
          type SendMessageRequest struct { SentMessage *Message }
          type SendMessageResponse struct { Ok bool }
          func (x *JoinChannelRequest) GetChannelToJoin() *Channel { if x != nil { return x.ChannelToJoin }; return nil }
          func (x *JoinChannelResponse) GetMessageStream() *Message { if x != nil { return x.MessageStream }; return nil }
          func (x *SendMessageRequest) GetSentMessage() *Message { if x != nil { return x.SentMessage }; return nil }
          func (x *SendMessageResponse) GetOk() bool { if x != nil { return x.Ok }; return false }
          EOFPB
          cat > gen/chat/v1/chatv1connect/chat.connect.go << 'EOFCON'
          package chatv1connect
          import (
            "context"
            "net/http"
            chatv1 "Hermes/gen/chat/v1"
            "connectrpc.com/connect"
          )
          type ChatServiceHandler interface {
            JoinChannel(context.Context, *connect.Request[chatv1.JoinChannelRequest], *connect.ServerStream[chatv1.JoinChannelResponse]) error
            SendMessage(context.Context, *connect.Request[chatv1.SendMessageRequest]) (*connect.Response[chatv1.SendMessageResponse], error)
          }
          type UnimplementedChatServiceHandler struct{}
          func (UnimplementedChatServiceHandler) JoinChannel(context.Context, *connect.Request[chatv1.JoinChannelRequest], *connect.ServerStream[chatv1.JoinChannelResponse]) error {
            return connect.NewError(connect.CodeUnimplemented, nil)
          }
          func (UnimplementedChatServiceHandler) SendMessage(context.Context, *connect.Request[chatv1.SendMessageRequest]) (*connect.Response[chatv1.SendMessageResponse], error) {
            return nil, connect.NewError(connect.CodeUnimplemented, nil)
          }
          func NewChatServiceHandler(svc ChatServiceHandler, opts ...connect.HandlerOption) (string, http.Handler) {
            return "/chat.v1.ChatService/", http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              http.Error(w, "stub", http.StatusNotImplemented)
            })
          }
          EOFCON

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate stub types for build
        run: |
          mkdir -p gen/chat/v1/chatv1connect
          cat > gen/chat/v1/chat.pb.go << 'EOFPB'
          package chatv1
          type User struct { Id, Username string }
          type Channel struct { Id, Name, Label string; Users []*User }
          type Message struct { Id, ChannelId, UserId, Content string; Timestamp int64 }
          type JoinChannelRequest struct { ChannelToJoin *Channel }
          type JoinChannelResponse struct { MessageStream *Message }
          type SendMessageRequest struct { SentMessage *Message }
          type SendMessageResponse struct { Ok bool }
          func (x *JoinChannelRequest) GetChannelToJoin() *Channel { if x != nil { return x.ChannelToJoin }; return nil }
          func (x *JoinChannelResponse) GetMessageStream() *Message { if x != nil { return x.MessageStream }; return nil }
          func (x *SendMessageRequest) GetSentMessage() *Message { if x != nil { return x.SentMessage }; return nil }
          func (x *SendMessageResponse) GetOk() bool { if x != nil { return x.Ok }; return false }
          EOFPB
          cat > gen/chat/v1/chatv1connect/chat.connect.go << 'EOFCON'
          package chatv1connect
          import (
            "context"
            "net/http"
            chatv1 "Hermes/gen/chat/v1"
            "connectrpc.com/connect"
          )
          type ChatServiceHandler interface {
            JoinChannel(context.Context, *connect.Request[chatv1.JoinChannelRequest], *connect.ServerStream[chatv1.JoinChannelResponse]) error
            SendMessage(context.Context, *connect.Request[chatv1.SendMessageRequest]) (*connect.Response[chatv1.SendMessageResponse], error)
          }
          type UnimplementedChatServiceHandler struct{}
          func (UnimplementedChatServiceHandler) JoinChannel(context.Context, *connect.Request[chatv1.JoinChannelRequest], *connect.ServerStream[chatv1.JoinChannelResponse]) error {
            return connect.NewError(connect.CodeUnimplemented, nil)
          }
          func (UnimplementedChatServiceHandler) SendMessage(context.Context, *connect.Request[chatv1.SendMessageRequest]) (*connect.Response[chatv1.SendMessageResponse], error) {
            return nil, connect.NewError(connect.CodeUnimplemented, nil)
          }
          func NewChatServiceHandler(svc ChatServiceHandler, opts ...connect.HandlerOption) (string, http.Handler) {
            return "/chat.v1.ChatService/", http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              http.Error(w, "stub", http.StatusNotImplemented)
            })
          }
          EOFCON

      - name: Build
        run: go build -v -o bin/server ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: bin/server
          retention-days: 7
